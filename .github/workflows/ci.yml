name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_go
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server_go/go.mod
          cache-dependency-path: server_go/go.mod
      - name: Run Go tests
        run: go test ./...

  flutter-checks:
    name: Flutter checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bondi_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze (errors block; existing lint debt remains visible)
        # Flutter currently reports legacy info/warning diagnostics. Keep them visible
        # without blocking CI; analysis errors still fail the job.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        run: flutter test
