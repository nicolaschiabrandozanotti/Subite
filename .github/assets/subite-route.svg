<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 255" role="img" aria-labelledby="title description">
  <title id="title">Del origen al destino</title>
  <desc id="description">Ilustración de un recorrido de colectivo con un punto de salida, una línea y un destino.</desc>
  <defs>
