    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#54B5FF"/><stop offset="1" stop-color="#58DFB1"/></linearGradient>
  </defs>
  <rect width="1100" height="255" rx="24" fill="url(#panel)"/>
  <g opacity=".11" fill="none" stroke="#C1E7FF" stroke-width="2">
